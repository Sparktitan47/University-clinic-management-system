<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>University Clinic - Counsellor Dashboard</title>
<link rel="stylesheet" href="token.css" />
<link rel="stylesheet" href="staff.css" />
</head>
<body class="staff-page" data-role="counsellor">
<header class="staff-topbar">
  <div class="staff-brand"><span class="clinic-logo" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/><rect x="3.5" y="3.5" width="17" height="17" rx="5"/></svg></span><span>University Clinic <small><span id="staffRoleLabel">Counsellor</span> dashboard</small></span></div>
  <div><strong id="staffName"></strong> <span class="mono" id="staffId"></span></div>
  <div class="staff-topbar-actions">
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
    <button class="btn btn-sm btn-ghost sign-out-btn">Sign out</button>
  </div>
</header>
<main class="staff-shell">
  <aside class="convo-sidebar">
    <div class="sidebar-head">
      <h3>Student messages</h3>
      <div class="sidebar-search"><svg class="ui-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="searchInput" placeholder="Name or ID" /></div>
    </div>
    <div class="convo-list" id="convoList"></div>
  </aside>
  <section class="chat-pane">
    <div class="chat-pane-empty" id="chatEmpty"><div class="empty-icon"><svg class="ui-icon ui-icon-lg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.5-5A8 8 0 1 1 21 12Z"/></svg></div><h3>Select a student conversation</h3></div>
    <div class="chat-pane hidden" id="chatActive">
      <div class="chat-pane-header"><div><h3 id="chatHeaderName"></h3><p id="chatHeaderId"></p></div></div>
      <div class="chat-pane-messages" id="chatMessages"></div>
      <div class="chat-pane-input"><textarea id="chatInput" rows="1" placeholder="Write a reply"></textarea><button class="send-btn" id="sendBtn" aria-label="Send message"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg></button></div>
    </div>
  </section>
  <aside class="appt-panel">
    <div class="appt-panel-head"><h3>Appointments</h3></div>
    <div class="appt-scroll" id="apptList"></div>
    <div class="appt-panel-head"><h3>Availability</h3></div>
    <div class="appt-scroll">
      <div id="dayGrid" class="avail-grid"></div>
      <div class="field"><label for="avStartTime">Start</label><input id="avStartTime" type="time" /></div>
      <div class="field"><label for="avEndTime">End</label><input id="avEndTime" type="time" /></div>
      <div class="field"><label for="avDuration">Slot minutes</label><input id="avDuration" type="number" min="10" step="5" /></div>
      <button class="btn btn-primary" id="saveAvailBtn">Save availability</button>
    </div>
  </aside>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="Doctor.js"></script>
</body>
</html>
